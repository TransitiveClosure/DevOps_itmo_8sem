services:
  frontend:
    build:
      context: ./react-frontend
      dockerfile: Dockerfile
    restart: always
    networks:
      - app-network
    depends_on:
      - backend
    environment:
      REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL}
    env_file:
     - react-frontend/.env

  backend:
    build:
      context: ./spring-backend
      dockerfile: Dockerfile
    restart: always
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_HOST: ${DB_HOST}
    env_file:
     - .env

  db:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - app-network
    volumes:
      - db_data:/var/lib/mysql
    env_file:
     - .env
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx-proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8081:8081"
    networks:
      - app-network
    depends_on:
      - frontend
      - backend
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf

networks:
  app-network:
    driver: bridge

volumes:
  db_data: